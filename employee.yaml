apiVersion: digital-employee/v1
kind: DigitalEmployee
metadata:
  id: de_local_store_video_director
  name: 探店短视频编导
  alias: null
  repo: de-local-store-video-director
  card_no: 7.4.2 ①
  group: local
  group_label: 本地生活服务商家
  phase: '**P0 首发**（ROI 最直白，决策者一眼算得过账）'
  complexity: M（W5 需连接器，其余 S）
  score: 24
  price: 300–2000 元/月（本地商家愿为 AI 批量内容付 500–2000 元/月，据 R4 调研）；**代配置服务加成：500–1500 元/次**（卖点库灌入+账号授权代办+首周陪跑，可占总成交额的 30–50%，本群体付费意愿最强的增值服务）
  channels:
  - GitHub（必备）
  - '**小红书**（目标老板聚集地，教程种草转化）'
  - '**抖音**（用产品产出的内容做自证营销）'
  - Coze 扣子商店
  license: Proprietary
  version: 1.0.0
spec:
  positioning: 门店的"编外内容总监"：每天给出拍什么、怎么拍、怎么挂团购的完整答案
  users: 无内容团队的餐饮/美业/健身门店老板（71% 无专业内容团队，据 R4 调研）
  boundary: '**做**：选题策划、脚本与口播文案、分镜建议、封面标题、发布排期、团购挂载建议；**不做**：不代发（发布动作留给老板一键完成）、不承诺播放量、不做付费投流建议'
  kpi: 周产出可用脚本 ≥5 条；老板单条素材加工耗时 ≤20 分钟；内容更新频率 ≥3 条/周
  roi_summary: 替代 8000 元/月外包，省 75% 成本（据 R4 调研）；月省工时 ≥30 小时
  demand_refs:
  - D01
  - D21
  demand_support: 充分
  demand_evidence: 中
runtime:
  system_prompt: persona/system-prompt.md
  boundary: persona/boundary.md
  kpi: persona/kpi.md
deliverables:
  skills:
  - slug: aigc-labeling-compliance
    name: AIGC 内容标识合规
    kind: private
    path: skills/aigc-labeling-compliance
    version: 1.0.0
    maturity: contract-complete
  - slug: local-trend-monitor
    name: 本地热点监控
    kind: private
    path: skills/local-trend-monitor
    version: 1.0.0
    maturity: contract-complete
  workflows:
  - slug: wf-local-video-hot-topic
    name: 热点选题抓取
    path: workflows/wf-local-video-hot-topic
    version: 1.0.0
    phase: P0
    calls:
    - local-trend-monitor
  - slug: wf-local-video-script
    name: 探店脚本生成
    path: workflows/wf-local-video-script
    version: 1.0.0
    phase: P0
    calls:
    - script-structure
  - slug: wf-local-video-oral-storyboard
    name: 口播文案+分镜
    path: workflows/wf-local-video-oral-storyboard
    version: 1.0.0
    phase: P0
    calls:
    - script-structure
  - slug: wf-local-video-cover-title
    name: 封面标题生成
    path: workflows/wf-local-video-cover-title
    version: 1.0.0
    phase: P0
    calls:
    - platform-format-adapter
  - slug: wf-local-video-review
    name: 发布日历与复盘
    path: workflows/wf-local-video-review
    version: 1.0.0
    phase: P1
    calls:
    - local-trend-monitor
    - platform-format-adapter
  knowledge_base: kb/
  connectors: connectors/bindings.yaml
external_dependencies:
- repo: agent-skills-core
  version: 1.0.0
  skills:
  - groupbuy-copy-writer
  - platform-format-adapter
  - script-structure
  resolution: external
spec_only_dependencies: []
