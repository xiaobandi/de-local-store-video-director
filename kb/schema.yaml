version: 1.0.0
employee: de-local-store-video-director
embedding:
  model: <由部署方指定>
  dim: <待填>
  normalize: true
chunking:
  strategy: semantic+overlap
  max_tokens: 512
  overlap_tokens: 64
  keep_headers: true
  reason: 长文档按语义边界切，保留标题层级，便于产出里回指出处
retrieval:
  top_k: 8
  rerank: true
  rerank_top_n: 3
  min_score: 0.35
  min_score_reason: 低于该分视为无匹配，必须回「知识库无匹配」而不是硬答
citation:
  required: true
  format: '来源: <file>#<chunk_id>'
  stale_after_days: 180
collections:
- name: 菜品/项目卖点库（一次性灌入，月更）
  source: <待填>
  update: <待填>
  owner: <待填>
  pii: unknown
- name: 历史爆款内容库（自建 RAG，越用越准）
  source: <待填>
  update: <待填>
  owner: <待填>
  pii: unknown
- name: 同城标杆脚本结构库（平台侧维护）。
  source: <待填>
  update: <待填>
  owner: <待填>
  pii: unknown
pii_policy:
  mask:
  - 手机号
  - 身份证
  - 详细地址
  - 银行卡
  note: 入库前脱敏；检索结果命中 PII 时先脱敏再输出
